<!DOCTYPE html>
<html>
<head>
    <title>American Board of Ophthalmology</title>
     <link rel="icon" type="image/png" href="https://manav-132.github.io/B2C.UI/abologo.png">
    <style>
        body { background-color: #f8f9fa; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .master-card { background-color: #ffffff; width: 100%; max-width: 480px; padding: 40px; border-radius: 12px; border: 1px solid #e1e4e8; box-shadow: 0 10px 25px rgba(0,0,0,0.05); box-sizing: border-box; }
        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-container img { max-width: 160px; height: auto; }
        div#claimVerificationServerError {
    color: red;
    margin-left: 2.5rem;
}
        div#passwordEntryMismatch {
    color: red;
    margin-left: 1rem;
}
        div#email_fail_retry {
    color: red;
}

        /* --- REMOVE SYSTEM ELEMENTS --- */
         #api .helpLink, #api #cancel, #api .buttons #cancel, #api #email_ver_but_edit { 
            display: none !important; 
        }
        #api .intro{
            display: none;
        }
        div#requiredFieldMissing {
    color: red;
    margin-right: 1rem;
    margin-left: 1rem;
}

        p {
    margin-left: 1rem;
    margin-right: 1rem;
    line-height: 30px;
}


        /* --- SPACING & TEXT --- */
        #api h2 { font-size: 22px; font-weight: 700; color: #000; margin-bottom: 20px; }
        /* The Verification instructions text */
        #api .verificationInfoText { margin-bottom: 20px; line-height: 30px; color: black;  display: block; }
        
        #api .attrEntry { margin-bottom: 20px; }
        #api label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        #api input { width: 100%; padding: 14px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; }

        /* Verification Action Buttons (Send Code / Verify Code) */
        #api .verify { margin-top: 10px; }
        #api button#email_ver_but_send, #api button#email_ver_but_verify {
    margin-top: 1.5rem;
    background-color: #ff7424;
    color: white;
    border: 1px solid #ff7424;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    width:100%;
}
        button#email_ver_but_resend {
    background-color: #ff7424;
    color: white;
    border: 1px solid #ff7424;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
            width:100%;
    margin-top: 1rem;
}
        #api button#email_ver_but_send:hover { background-color: #e2e8f0; }

        /* --- THEME CONTINUE BUTTON (Modified for 100% width) --- */
        #api button#continue, #api button#next {
            display: none;
            width: 100% !important; /* Set to 100% */
            padding: 10px 20px;
            background-color: #ff7424 !important;
            color: white !important;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 25px;
            cursor: pointer;
            margin-left: 0 !important; /* Remove margin for 100% width */
            margin-right: 0 !important;
        }
        
        /* --- STYLE FOR THE NEW EMBEDDED CANCEL BUTTON --- */
        #externalCancelButton {
            background-color: white;
            color: #ff7424; /* Primary theme color for text */
            border: 1px solid #ff7424;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width:100%; /* Match Send button width */
            margin-top: 10px;
        }

        h1 {
            display:none;
        }

        ul {
            list-style-type: none;
        }

        form#attributeVerification {
            margin-right:2rem !important;
        }
        .error.itemLevel {
            color: red;
        }

        label#email_label {
            margin-top:1rem
        }
        #verifying_blurb, 
        .verifying-modal, 
        #simplemodal-overlay, 
        #simplemodal-container {
            display: none !important;
        }

        /* Optional: Prevent a 'flicker' of unstyled text by ensuring the body is clean */
        #waiting_container {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="master-card">
        <div class="logo-container">
            <img src="https://manav-132.github.io/B2C.UI/abologo.png" alt="ABO Logo">
        </div>
        <div id="api"></div>
        
        <!-- NEW CANCEL BUTTON BLOCK WITH ID - Target of the JS -->
        <a href="https://sfuat.abop.org/physician/s/" id="externalCancelLink" style="display:none; text-decoration: none;"> 
            <button id="externalCancelButton" type="button">Cancel</button> 
        </a>
        
    </div>

   <script>
    document.addEventListener('keydown', function(event) {
        // Check if the pressed key is 'Enter' (Key code 13)
        if (event.key === 'Enter' || event.keyCode === 13) {
            
            // Optional: Only disable it for input fields so it doesn't 
            // interfere with buttons if they are focused
            if (event.target.tagName === 'INPUT') {
                event.preventDefault(); // Stop the default B2C submit action
                return false;
            }
        }
    }, true);
    
    // The main logic loop
    setInterval(function() {
        var successMsg = document.getElementById('email_success');
        var passwordField = document.getElementById('newPassword'); 
        var continueBtn = document.getElementById('continue') || document.getElementById('next');
        var introText = document.querySelector('#api .intro');
        
        // B2C System Cancel Button (used for the specific error state)
        var systemCancelBtn = document.getElementById('email_ver_but_edit');
        // Custom Cancel Link (used for the initial screen)
        var externalCancelLink = document.getElementById('externalCancelLink'); 
        var externalCancelButton = document.getElementById('externalCancelButton'); 
        
        var pageContent = document.getElementById('api').innerText;

        // 1. Check for the specific 'Account Does Not Exist' error text
        var specificErrorPresent = pageContent.includes("not currently associated with an ABO account");

        // --- State 1: Specific Error (User Not Found) ---
        if (specificErrorPresent) {
            // Hide the continue button
            if (continueBtn) {
                continueBtn.style.setProperty('display', 'none', 'important');
            }
            
            // Hide the custom external cancel link
            if (externalCancelLink) {
                externalCancelLink.style.display = 'none';
            }
            
            // Show and style the B2C system cancel button for the error state
            if (systemCancelBtn) {
                systemCancelBtn.textContent = 'Contact Support / Cancel'; 
                systemCancelBtn.style.cssText = `
                    width: 100%;
                    padding: 10px 20px;
                    background-color: #f44336 !important; /* Use a distinct red color for error exit */
                    color: white !important;
                    border: none;
                    border-radius: 8px;
                    font-weight: 700;
                    margin-top: 25px;
                    cursor: pointer;
                    display: block !important;
                `;
            }
            return; // Stop processing other states
        }
        
        // --- State 2: Strictly Initial Email Screen (Check for the intro text) ---
        var isInitialEmailScreen = pageContent.includes("Enter the email address currently associated with your ABO account");
        
        if (isInitialEmailScreen) {
            // SHOW on the initial screen
            if (externalCancelLink) {
                externalCancelLink.style.display = 'block';
            }
            // Ensure the button text is just "Cancel" and use the correct styling
            if (externalCancelButton) {
                externalCancelButton.textContent = 'Cancel';
                // Reset to the secondary style (white background, orange border/text)
                externalCancelButton.style.backgroundColor = 'white';
                externalCancelButton.style.color = '#ff7424';
                externalCancelButton.style.borderColor = '#ff7424';
            }
        } else {
            // HIDE on all other screens (Code Entry, Password Set, etc.)
            if (externalCancelLink) {
                externalCancelLink.style.display = 'none';
            }
        }
        
        // --- State 3: Normal Flow Clean-up & Continue Logic ---
        
        // Ensure the B2C system cancel button is hidden in all non-error normal states
        if (systemCancelBtn) {
            systemCancelBtn.style.setProperty('display', 'none', 'important');
        }
        
        // Existing logic for intro text
        if (introText) {
            if (passwordField) {
                introText.style.display = 'block';
            } else {
                introText.style.display = 'none';
            }
        }

        // Existing logic for continue button
        if (continueBtn) {
            if (passwordField) {
                continueBtn.style.setProperty('display', 'block', 'important');
            } else if (successMsg) {
                var isVerified = window.getComputedStyle(successMsg).display !== 'none';
                if (isVerified) {
                    continueBtn.style.setProperty('display', 'block', 'important');
                } else {
                    continueBtn.style.setProperty('display', 'none', 'important');
                }
            } else {
                continueBtn.style.setProperty('display', 'none', 'important');
            }
        }
    }, 500);
</script>
</body>
</html>
