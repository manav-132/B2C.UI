
<!DOCTYPE html>
<html>
<head>
    <title>American Board of Ophthalmology</title>
     <link rel="icon" type="image/png" href="https://manav-132.github.io/B2C.UI/abologo.png">
    <style>
        body { background-color: #f8f9fa; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .master-card { background-color: #ffffff; width: 100%; max-width: 480px; padding: 40px; border-radius: 12px; border: 1px solid #e1e4e8; box-shadow: 0 10px 25px rgba(0,0,0,0.05); box-sizing: border-box; }
        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-container img { max-width: 160px; height: auto; }
        div#claimVerificationServerError {
    color: red;
    margin-left: 2.5rem;
}
        div#passwordEntryMismatch {
    color: red;
    margin-left: 1rem;
}
        div#email_fail_retry {
    color: red;
}

        /* --- REMOVE SYSTEM ELEMENTS --- */
         #api .helpLink, #api #cancel, #api .buttons #cancel, #api #email_ver_but_edit { 
            display: none !important; 
        }
        #api .intro{
            display: none;
        }
        div#requiredFieldMissing {
    color: red;
    margin-right: 1rem;
    margin-left: 1rem;
}

        p {
    margin-left: 1rem;
    margin-right: 1rem;
    line-height: 30px;
}


        /* --- SPACING & TEXT --- */
        #api h2 { font-size: 22px; font-weight: 700; color: #000; margin-bottom: 20px; }
        /* The Verification instructions text */
        #api .verificationInfoText { margin-bottom: 20px; line-height: 30px; color: black;  display: block; }
        
        #api .attrEntry { margin-bottom: 20px; }
        #api label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        #api input { width: 100%; padding: 14px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; }

        /* Verification Action Buttons (Send Code / Verify Code) */
        #api .verify { margin-top: 10px; }
        #api button#email_ver_but_send, #api button#email_ver_but_verify {
    margin-top: 1.5rem;
    background-color: #2e71ca;
    color: white;
    border: 1px solid #2e71ca;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    width:100%;
}
        button#email_ver_but_resend {
    background-color: #2e71ca;
    color: white;
    border: 1px solid #2e71ca;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
            width:100%;
    margin-top: 1rem;
}
        #api button#email_ver_but_send:hover { background-color: #e2e8f0; }

        /* --- THEME CONTINUE BUTTON --- */
        #api button#continue, #api button#next {
    display: none;
    width: 90%;
    padding: 10px 20px;
    background-color: #2e71ca !important;
    color: white !important;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    margin-top: 25px;
    cursor: pointer;
    margin-left: 2.4rem;
    margin-right: 1rem;
}
        h1 {
    display:none;
}

ul {
    list-style-type: none;
}

form#attributeVerification {
    margin-right:2rem !important;
}
.error.itemLevel {
    color: red;
}

label#email_label {
    margin-top:1rem
}
        #verifying_blurb, 
.verifying-modal, 
#simplemodal-overlay, 
#simplemodal-container {
    display: none !important;
}

/* Optional: Prevent a 'flicker' of unstyled text by ensuring the body is clean */
#waiting_container {
    display: none !important;
}
    </style>
</head>
<body>
    <div class="master-card">
        <div class="logo-container">
            <img src="https://manav-132.github.io/B2C.UI/abologo.png" alt="ABO Logo">
        </div>
        <div id="api"></div>
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
        // Check if the pressed key is 'Enter' (Key code 13)
        if (event.key === 'Enter' || event.keyCode === 13) {
            
            // Optional: Only disable it for input fields so it doesn't 
            // interfere with buttons if they are focused
            if (event.target.tagName === 'INPUT') {
                event.preventDefault(); // Stop the default B2C submit action
                return false;
            }
        }
    }, true);
    setInterval(function() {
        var successMsg = document.getElementById('email_success');
        var passwordField = document.getElementById('newPassword'); // Check for password field
        var continueBtn = document.getElementById('continue') || document.getElementById('next');
        var introText = document.querySelector('#api .intro');
    
    if (introText) {
        // Only show this specific password help text if the password field is actually on screen
        if (passwordField) {
            introText.style.display = 'block';
        } else {
            introText.style.display = 'none';
        }
    }

        if (continueBtn) {
            // Logic 1: If we are on the Password Screen (newPassword exists), always show button
            if (passwordField) {
                continueBtn.style.setProperty('display', 'block', 'important');
            } 
            // Logic 2: If we are on the Verification Screen, only show if verified
            else if (successMsg) {
                var isVerified = window.getComputedStyle(successMsg).display !== 'none';
                if (isVerified) {
                    continueBtn.style.setProperty('display', 'block', 'important');
                } else {
                    continueBtn.style.setProperty('display', 'none', 'important');
                }
            }
        }
    }, 500);
</script>
</body>
</html>
