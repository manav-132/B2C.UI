<!DOCTYPE html>
<html>
<head>
    <title>American Board of Ophthalmology</title>
    <link rel="icon" type="image/png" href="https://manav-132.github.io/B2C.UI/abologo.png">
    <style>
        /* Your Existing CSS */
        body { 
            background-color: #f8f9fa; 
            font-family: 'Open Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .master-card { 
            background-color: #ffffff; 
            width: 100%; 
            max-width: 440px; 
            padding: 40px; 
            padding-bottom: 120px; 
            border-radius: 12px; 
            border: 1px solid #e1e4e8; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            box-sizing: border-box;
            position: relative; 
        }

        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 160px; height: auto; }

        h2 { display:none !important; }

        button#ForgotPasswordExchange {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
            width: auto;
            padding: 16px;
            background-color: #ff7424 !important;
            color: white !important;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        #api .error.pageLevel {
            display: block !important;
            color: red !important;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .error.itemLevel { color: red; font-size: 13px; }

        #api .forgotPassword, #api #forgotPassword, #api .helpLink, 
        #api .divider, #api .create, #api #cancel, #api .buttons #cancel { 
            display: none !important; 
        }

        #api h1 { font-size: 28px; font-weight: 700; margin-bottom: 25px; color: #000; }
        .entry-item { margin-bottom: 20px; }
        #api label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        #api input { 
            width: 100%; padding: 14px; border: 1px solid #cbd5e0; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; 
        }
        #api input:focus { border-color: #ff7424; outline: none; }

        #api button#next { 
            width: 100%; padding: 16px; background-color: #ff7424 !important; color: white !important; 
            border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer;
        }

        #verifying_blurb, .verifying-modal, #waiting_container { display: none !important; }
        
        /* New CSS for the timeout message */
        #timeout-message {
            display: none;
            text-align: center;
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
    
    <script>
        // 1. Enter Key Blocker (Your existing code)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                if (event.target.tagName === 'INPUT') {
                    event.preventDefault();
                    return false;
                }
            }
        }, true);

        // 2. NEW CODE: Session Timeout Handler
        // Set timeout duration in milliseconds (e.g., 15 minutes = 900000ms)
        // We set it slightly lower than the Salesforce timeout to be safe.
        const SESSION_TIMEOUT = 15 * 60 * 1000; 

        setTimeout(function() {
            // Option A: Reload the page automatically (Might not fix it if URL params are old)
            // window.location.reload(); 

            // Option B: Disable the form and tell user to start over (Best UX for security)
            var apiDiv = document.getElementById('api');
            var timeoutDiv = document.getElementById('timeout-message');
            
            if(apiDiv) {
                // Hide the login form so they can't submit expired credentials
                apiDiv.style.display = 'none'; 
            }
            
            if(timeoutDiv) {
                timeoutDiv.style.display = 'block';
            }
            
            // Hide the forgot password button too
            var forgotBtn = document.getElementById('ForgotPasswordExchange');
            if(forgotBtn) forgotBtn.style.display = 'none';

        }, SESSION_TIMEOUT);
    </script>
</head>
<body>
    <div class="master-card">
        <div class="logo-container">
            <img src="https://manav-132.github.io/B2C.UI/abologo.png" alt="ABO Logo">
        </div>
        
        <!-- B2C injects content here -->
        <div id="api"></div>

        <!-- New Timeout Message -->
        <div id="timeout-message">
            <h3>Session Expired</h3>
            <p>For your security, this login session has timed out due to inactivity.</p>
            <p><a href="javascript:window.location.reload(true)" style="color:#721c24; font-weight:bold;">Click here to refresh the page</a></p>
        </div>
    </div>
</body>
</html>
