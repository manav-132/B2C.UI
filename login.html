<!DOCTYPE html>
<html>
<head>
    <title>American Board of Ophthalmology - Sign In</title>
    <style>
        body { background-color: #f8f9fa; font-family: 'Open Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .master-card { background-color: #ffffff; width: 100%; max-width: 440px; padding: 40px; border-radius: 12px; border: 1px solid #e1e4e8; box-shadow: 0 10px 25px rgba(0,0,0,0.05); box-sizing: border-box; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 160px; height: auto; }
        h2 {
    display:none !important;
}

button#ForgotPasswordExchange {
    display:none !important;
}
        div#requiredFieldMissing {
    color: red;
    margin-right: 1rem;
    margin-left: 1rem;
}

        /* --- REMOVE FORGOT PASSWORD & CANCEL BUTTONS --- */
        #api .forgotPassword,
        #api .helpLink, 
        #api .divider, 
        #api .create,
        #api #cancel,
        #api .buttons #cancel { 
            display: none !important; 
        }

        /* --- THEME & SPACING --- */
        #api h1 { font-size: 28px; font-weight: 700; margin-bottom: 25px; color: #000; }
        .entry-item { margin-bottom: 20px; }
        #api label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        #api input { 
            width: 100%; padding: 14px; border: 1px solid #cbd5e0; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; transition: border-color 0.2s; 
        }
        #api input:focus { border-color: #2e71ca; outline: none; box-shadow: 0 0 0 3px rgba(46, 113, 202, 0.1); }

        /* --- BUTTON THEME --- */
        #api button#next { 
            width: 100%; padding: 16px; background-color: #2e71ca !important; color: white !important; 
            border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        #api button#next:hover { background-color: #245ba3 !important; }
        .error.itemLevel {
    color: red;
}
        #verifying_blurb, 
.verifying-modal, 
#simplemodal-overlay, 
#simplemodal-container {
    display: none !important;
}

/* Optional: Prevent a 'flicker' of unstyled text by ensuring the body is clean */
#waiting_container {
    display: none !important;
}
    </style>
</head>
<body>
    <div class="master-card">
        <div class="logo-container">
            <img src="https://manav-132.github.io/B2C.UI/abologo.png" alt="ABO Logo">
        </div>
        <div id="api"></div>
    </div>
</body>
</html>
