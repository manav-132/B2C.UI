<!DOCTYPE html>
<html>
<head>
    <title>American Board of Ophthalmology</title>
     <link rel="icon" type="image/png" href="https://manav-132.github.io/B2C.UI/abologo.png">
    <style>
        /* 1. Core Layout */
        body { 
            background-color: #f8f9fa; 
            font-family: 'Open Sans', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* 2. The Card - Added 'position: relative' to act as a container for absolute elements */
        .master-card { 
            background-color: #ffffff; 
            width: 100%; 
            max-width: 440px; 
            padding: 40px; 
            padding-bottom: 120px; /* Extra space at bottom for the forgot password button */
            border-radius: 12px; 
            border: 1px solid #e1e4e8; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            box-sizing: border-box;
            position: relative; 
        }

        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 160px; height: auto; }

        h2 { display:none !important; }

        /* 3. The Forgot Password Button - Fixed at the bottom of the card */
        button#ForgotPasswordExchange {
            position: absolute;
            bottom: 40px;
            left: 40px;
            right: 40px;
            width: auto;
            padding: 16px;
            background-color: #2e71ca !important;
            color: white !important;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        /* 4. Error Messages */
        #api .error.pageLevel {
            display: block !important;
            color: red !important;
            
            border-radius: 5px;
            
            font-weight: bold;
            font-size: 14px;
        }

        .error.itemLevel { color: red; font-size: 13px; }

        /* 5. Clean up B2C Default Elements */
        #api .forgotPassword, #api #forgotPassword, #api .helpLink, 
        #api .divider, #api .create, #api #cancel, #api .buttons #cancel { 
            display: none !important; 
        }

        #api h1 { font-size: 28px; font-weight: 700; margin-bottom: 25px; color: #000; }
        .entry-item { margin-bottom: 20px; }
        #api label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        #api input { 
            width: 100%; padding: 14px; border: 1px solid #cbd5e0; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; 
        }
        #api input:focus { border-color: #2e71ca; outline: none; }

        #api button#next { 
            width: 100%; padding: 16px; background-color: #2e71ca !important; color: white !important; 
            border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer;
        }

        /* Prevent flicker */
        #verifying_blurb, .verifying-modal, #waiting_container { display: none !important; }

    </style>
    <script>
        // Removing the MutationObserver as Absolute Positioning handles the movement automatically.
        // We only keep the Enter key block if you strictly want to prevent 'Enter' login.
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                if (event.target.tagName === 'INPUT') {
                    event.preventDefault();
                    return false;
                }
            }
        }, true);
    </script>
</head>
<body>
    <div class="master-card">
        <div class="logo-container">
            <img src="https://manav-132.github.io/B2C.UI/abologo.png" alt="ABO Logo">
        </div>
        <div id="api"></div>
    </div>

    
</body>
</html>
